[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra

# Marcas por técnica de caja negra (U2 · Tarea 4).
# Permiten ejecutar una técnica aislada:  pytest -m limite -v
markers =
    particion: partición de equivalencia — R02, catálogo de tipos de equipo
    limite: análisis de valores límite — R03, rango de laboratorios [1, 6]
    decisiones: tabla de decisiones — R04 x R01, autenticación y unicidad
    estados: transición de estados — R05, R06, R07, ciclo de vida del bien
